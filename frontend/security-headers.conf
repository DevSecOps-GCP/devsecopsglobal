# Included in every location: a location-level add_header drops server-level ones in nginx.
# Videos stream from signed GCS URLs (prod) or /api/media (local), hence storage.googleapis.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' https://storage.googleapis.com; connect-src 'self' https://storage.googleapis.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
