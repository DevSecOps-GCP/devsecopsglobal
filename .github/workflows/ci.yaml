name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A release on main always finishes; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learnhub
          POSTGRES_USER: learnhub
          POSTGRES_PASSWORD: learnhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learnhub" --health-interval 3s --health-retries 20
    env:
      REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Redis with AUTH (like Memorystore)
        run: docker run -d -p 6379:6379 redis:7.2-alpine redis-server --requirepass "$REDIS_PASSWORD"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: |
          PGPASSWORD=learnhub psql -h localhost -U learnhub -d learnhub -c "CREATE DATABASE learnhub_test"
          uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
      - name: Dependency and IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          tags: devsecopsglobal-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devsecopsglobal-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Publishes the images once every check on main has passed. Artifact Registry accepts
  # pushes only from main through the production environment (keyless, Workload Identity
  # Federation). Tags are the commit SHA and the repository's tags are immutable.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security, images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      REGISTRY: me-central1-docker.pkg.dev
      IMAGE: me-central1-docker.pkg.dev/devsecopsglobal-ops/devsecopsglobal/${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1000659746606/locations/global/workloadIdentityPools/github/providers/github-actions
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "$REGISTRY" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Summary
        run: echo "Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # Opens a pull request on the infrastructure repo pointing prod at the images just
  # released; ArgoCD deploys them once it is merged. The token (environment secret, so only
  # main can use it) may only write branches and pull requests on that repository.
  promote:
    needs: [release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      INFRA_REPO: DevSecOps-GCP/infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_PROMOTION_TOKEN }}
      - name: Open the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.INFRA_PROMOTION_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          short=${TAG::7}
          branch="promote/learnhub-$short"
          for component in backend frontend; do
            # The image tag is the only line of the form "  tag: <40-hex SHA>".
            sed -i -E "s/^(  tag: )[0-9a-f]{40}$/\1$TAG/" "kubernetes/helm/apps/learnhub-$component/values-prod.yaml"
          done
          if git diff --quiet; then
            echo "prod already runs $short" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deploy(learnhub): $short"
          git push origin "$branch"
          url=$(gh pr create --repo "$INFRA_REPO" --base main --head "$branch" \
            --title "deploy(learnhub): $short" \
            --body "Deploys backend and frontend images \`$TAG\` (${{ github.server_url }}/${{ github.repository }}/commit/$TAG) to prod.")
          echo "Promotion PR: $url" >> "$GITHUB_STEP_SUMMARY"
