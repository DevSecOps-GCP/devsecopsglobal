apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    # Before the migration Job (wave -1), which reads it.
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- with .Values.caCerts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-ca
  labels:
    {{- include "backend.labels" $ | nindent 4 }}
  annotations:
    # Before the migration Job (wave -1), which mounts it.
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
