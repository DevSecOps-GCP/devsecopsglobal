{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "route.gateway.name is required" .Values.route.gateway.name }}
      namespace: {{ required "route.gateway.namespace is required" .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ required "route.hostname is required" .Values.route.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 8080
{{- end }}
